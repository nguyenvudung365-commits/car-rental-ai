services:
  # SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: car-rental-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - car-rental-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -No -b
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: car-rental-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - car-rental-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Create the application bucket after MinIO is ready
  createbuckets:
    image: minio/mc:latest
    container_name: car-rental-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY}
      && mc mb --ignore-existing local/$${MINIO_BUCKET}"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - car-rental-net

  # .NET API
  api:
    build:
      context: .
      dockerfile: src/CarRental.API/Dockerfile
    container_name: car-rental-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__Default: Server=db,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True
      JwtSettings__SecretKey: ${JWT_KEY}
      AiService__BaseUrl: http://ai:5002
      AiService__TimeoutSeconds: ${AI_TIMEOUT_SECONDS}
      AiService__RetryCount: ${AI_RETRY_COUNT}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      Minio__Bucket: ${MINIO_BUCKET}
      Minio__UseSsl: ${MINIO_USE_SSL}
      Minio__PublicUrl: ${MINIO_PUBLIC_URL}
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    networks:
      - car-rental-net
    healthcheck:
      test: curl -f http://localhost:5001/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 3

  # FastAPI AI Service
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: car-rental-ai-service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 5002
    ports:
      - "5002:5002"
    networks:
      - car-rental-net
    healthcheck:
      test: curl -f http://localhost:5002/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car-rental-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - car-rental-net

volumes:
  sqldata:
  minio_data:

networks:
  car-rental-net:
    driver: bridge
